name: Update Manifest

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-manifest:
    name: Generate & Publish Update Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . --quiet
            echo "# Gold Client Update Manifest" > README.md
            git add README.md
            git commit -m "chore: initialise gh-pages branch"
            git push origin gh-pages
          fi

      - name: Resolve version and URLs
        id: vars
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          [ -z "$VERSION" ] && VERSION="v1.0.0"

          CHANGELOG="${{ github.event.release.html_url }}"
          [ -z "$CHANGELOG" ] && CHANGELOG="https://github.com/${{ github.repository }}/releases"

          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${VERSION}"

          echo "version=${VERSION}"     >> $GITHUB_OUTPUT
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT
          echo "base_url=${BASE}"       >> $GITHUB_OUTPUT

      - name: Write manifest.json
        run: |
          mkdir -p update-manifest
          cat > update-manifest/manifest.json << EOF
          {
            "version": "${{ steps.vars.outputs.version }}",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "channel": "stable",
            "changelog": "${{ steps.vars.outputs.changelog }}",
            "platforms": {
              "windows": {
                "url": "${{ steps.vars.outputs.base_url }}/GoldClient-Setup-${{ steps.vars.outputs.version }}.exe",
                "checksum": ""
              },
              "linux": {
                "url": "${{ steps.vars.outputs.base_url }}/GoldClient-${{ steps.vars.outputs.version }}.AppImage",
                "checksum": ""
              },
              "mac": {
                "url": "${{ steps.vars.outputs.base_url }}/GoldClient-${{ steps.vars.outputs.version }}.dmg",
                "checksum": ""
              }
            },
            "minVersion": "1.0.0",
            "forceUpdate": false
          }
          EOF

      - name: Commit and push
        run: |
          git add update-manifest/manifest.json
          git diff --staged --quiet \
            && echo "Nothing to commit." \
            || git commit -m "chore: update manifest to ${{ steps.vars.outputs.version }}"
          git push origin gh-pages
