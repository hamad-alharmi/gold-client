name: Update Manifest

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-manifest:
    name: Generate & Publish Update Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create update-manifest directory
        run: mkdir -p update-manifest

      - name: Generate manifest.json
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          cat > update-manifest/manifest.json << EOF
          {
            "version": "${VERSION}",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "channel": "stable",
            "changelog": "${{ github.event.release.html_url }}",
            "platforms": {
              "windows": {
                "url": "https://github.com/${REPO}/releases/download/${VERSION}/GoldClientSetup.exe",
                "checksum": "",
                "size": 0
              },
              "linux": {
                "url": "https://github.com/${REPO}/releases/download/${VERSION}/GoldClient-x86_64.AppImage",
                "checksum": "",
                "size": 0
              }
            },
            "minLauncherVersion": "1.0.0",
            "forceUpdate": false
          }
          EOF

      - name: Commit and push manifest to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update-manifest/manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest to ${{ github.event.release.tag_name }}"
          git push origin gh-pages
