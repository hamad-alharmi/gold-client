# Gold Client — Build & Release
#
# How to release:
#   git tag v1.0.1
#   git push origin v1.0.1
#   → Builds Gold Client Setup 1.0.1.exe and creates a GitHub Release.
#
# Manual build (no publish):
#   Go to Actions → Build & Release → Run workflow

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases?'
        type: choice
        default: 'false'
        options: ['true','false']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build — Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache: '' so we don’t require a lockfile

      # npm install (not npm ci) so we don’t need package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Build Vite renderer
        run: npx vite build

      # Tag push → build + publish to GitHub Releases
      - name: Build installer + publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --x64 --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual dispatch or PR → build only, no publish
      - name: Build installer (no publish)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldClient-Windows-x64
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          if-no-files-found: warn
          retention-days: 14

  # ── Create GitHub Release (only on tag push) ───────────────────────────────
  create-release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GoldClient-Windows-x64
          path: ./release-files

      - name: List release files
        run: ls -la ./release-files/

      - name: Get changelog
        id: log
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            CHANGES=$(git log ${PREV}..HEAD --pretty=format:'- %s' --no-merges)
          else
            CHANGES=$(git log --pretty=format:'- %s' --no-merges -25)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       Gold Client ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          body: |
            ## ⚔️ Gold Client ${{ github.ref_name }}

            ### 📥 Installation
            1. Download **Gold Client Setup ${{ github.ref_name }}.exe** below
            2. Run the installer (Windows 10/11 x64)
            3. Launch Gold Client from Desktop or Start Menu

            ### ✅ Requirements
            - Windows 10 or 11 (64-bit)
            - [Java 17+](https://adoptium.net) — required to launch Minecraft
            - Internet connection (downloads game assets on first launch)

            ### 🔄 What's Changed
            ${{ steps.log.outputs.changes }}

            ---
            *Built automatically by GitHub Actions*
          files: ./release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
