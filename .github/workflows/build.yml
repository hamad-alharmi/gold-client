name: Build Gold Client

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        include:
          - os: windows-latest
            native_ext: dll
          - os: ubuntu-latest
            native_ext: so
          - os: macos-latest
            native_ext: dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Gold Client JAR (shadowJar)
        run: ./gradlew shadowJar --no-daemon --stacktrace
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Configure native bridge (CMake)
        run: |
          cmake -S native-bridge -B native-bridge/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLAUNCHER_VERSION=${{ github.run_number }}

      - name: Build native bridge
        run: cmake --build native-bridge/build --config Release --parallel

      - name: Upload launcher JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-client-jar-${{ matrix.os }}
          path: launcher-core/build/libs/*-all.jar
          retention-days: 7

      - name: Upload native bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-bridge-${{ matrix.os }}
          path: native-bridge/build/**/*.${{ matrix.native_ext }}
          retention-days: 7
